# Central parameter file. Consumed by src/config.py and tracked by DVC so that
# every pipeline stage re-runs when a parameter changes.

data:
  raw_dir: data/raw
  processed_dir: data/processed
  image_size: 224          # 224x224 RGB, standard CNN input
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  seed: 42
  # Cap per class keeps the assignment pipeline runnable end-to-end on a laptop.
  # Set to 0 to use every image in the dataset.
  max_images_per_class: 2000

train:
  model_name: simple_cnn
  epochs: 8
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  dropout: 0.3
  num_workers: 2
  seed: 42
  early_stopping_patience: 3

augment:
  horizontal_flip: 0.5
  rotation_degrees: 15
  color_jitter: 0.2
  random_resized_crop_scale: [0.8, 1.0]

mlflow:
  tracking_uri: file:./mlruns
  experiment_name: cats-vs-dogs
  registered_model_name: cats-vs-dogs-cnn

serving:
  model_path: models/model.pt
  metadata_path: models/model_metadata.json
  class_names: ["cat", "dog"]
