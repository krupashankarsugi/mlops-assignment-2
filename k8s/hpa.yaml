# Optional: scale the inference service on CPU pressure.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cats-vs-dogs-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cats-vs-dogs-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
