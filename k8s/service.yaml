apiVersion: v1
kind: Service
metadata:
  name: cats-vs-dogs-api
  labels:
    app: cats-vs-dogs-api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
spec:
  type: NodePort
  selector:
    app: cats-vs-dogs-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      nodePort: 30080
