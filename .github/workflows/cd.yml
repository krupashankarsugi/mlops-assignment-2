# M4: Continuous Deployment -- pull the freshly built image and roll it out,
# then gate the pipeline on post-deploy smoke tests.
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy"
        required: false
        default: latest

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: ${{ github.event.inputs.image_tag || 'latest' }}

jobs:
  deploy:
    name: Deploy & Smoke Test
    runs-on: ubuntu-latest
    # Never deploy off a red CI run.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: production
      url: http://localhost:8000
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install smoke-test dependencies
        run: pip install requests==2.32.3 pillow==10.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Deployment target: a k3d Kubernetes cluster inside the runner -----
      - name: Create k3d cluster
        uses: AbsaOSS/k3d-action@v2
        with:
          cluster-name: mlops-cd
          args: >-
            --agents 1
            --port 8000:30080@agent:0

      - name: Pull the new image from the registry
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Import the image into the cluster
        run: k3d image import ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -c mlops-cd

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl set image deployment/cats-vs-dogs-api \
            api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Wait for the rollout to complete
        run: kubectl rollout status deployment/cats-vs-dogs-api --timeout=300s

      # --- Gate: fail the pipeline if the deployed service is not healthy ----
      - name: Post-deploy smoke test
        run: python scripts/smoke_test.py --url http://localhost:8000 --retries 30

      - name: Collect deployment diagnostics
        if: always()
        run: |
          kubectl get pods,svc,deploy -o wide
          kubectl logs -l app=cats-vs-dogs-api --tail=50 || true

      - name: Roll back on smoke-test failure
        if: failure()
        run: |
          echo "Smoke tests failed -- rolling back to the previous revision"
          kubectl rollout undo deployment/cats-vs-dogs-api || true
          kubectl rollout status deployment/cats-vs-dogs-api --timeout=120s || true
