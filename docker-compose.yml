# Alternative deployment target (M4): single-command local stack with
# Prometheus scraping the service's /metrics endpoint.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: cats-vs-dogs-api:latest
    container_name: cats-vs-dogs-api
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: INFO
      SERVICE_VERSION: "1.0.0"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: cats-vs-dogs-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      - api
    restart: unless-stopped
